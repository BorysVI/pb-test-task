services:
  postgres:
    image: 'postgres:18.6-alpine'
    environment:
      - 'POSTGRES_DB=orders'
      - 'POSTGRES_USER=db_client'
      - 'POSTGRES_PASSWORD=secret'
    ports:
      - '5433:5432'
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U db_client -d orders' ]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: 'rabbitmq:4.3.6-management-alpine'
    environment:
      - 'RABBITMQ_DEFAULT_USER=mq_client'
      - 'RABBITMQ_DEFAULT_PASS=secret'
    ports:
      - '5673:5672'
      - '15673:15672'
    healthcheck:
      test: [ 'CMD', 'rabbitmq-diagnostics', '-q', 'check_running' ]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    profiles: [ 'app' ]
    build: .
    ports:
      - '8081:8081'
    environment:
      - 'SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/orders'
      - 'SPRING_DATASOURCE_USERNAME=db_client'
      - 'SPRING_DATASOURCE_PASSWORD=secret'
      - 'SPRING_RABBITMQ_HOST=rabbitmq'
      - 'SPRING_RABBITMQ_USERNAME=mq_client'
      - 'SPRING_RABBITMQ_PASSWORD=secret'
      - 'SPRING_DOCKER_COMPOSE_ENABLED=false'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
